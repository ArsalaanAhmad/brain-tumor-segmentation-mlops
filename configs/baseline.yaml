data_root: /kaggle/input/brats2021  # update to match actual Kaggle dataset slug
output_dir: outputs/
model:
  architecture: unet3d
  in_channels: 4  # T1, T1ce, T2, FLAIR
  out_channels: 4  # background + 3 tumor sub-regions (BraTS convention)
training:
  epochs: 5
  batch_size: 1
  learning_rate: 0.0001